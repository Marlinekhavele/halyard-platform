[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halyard-billing"
version = "0.1.0"
description = "Halyard billing service: Invoices and margin."
requires-python = ">=3.11"
dependencies = ["halyard-common"]

[tool.setuptools.packages.find]
where = ["src"]
