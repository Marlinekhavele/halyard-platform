[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halyard-accounts"
version = "0.1.0"
description = "Halyard accounts service: Companies, users, sign-in and tokens."
requires-python = ">=3.11"
dependencies = ["halyard-common", "bcrypt>=4.1", "email-validator>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
