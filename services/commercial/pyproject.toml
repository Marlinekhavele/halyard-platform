[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halyard-commercial"
version = "0.1.0"
description = "Halyard commercial service: Ports, rates, quotes, bookings, leads."
requires-python = ">=3.11"
dependencies = ["halyard-common", "email-validator>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
