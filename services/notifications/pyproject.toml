[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halyard-notifications"
version = "0.1.0"
description = "Halyard notifications service: Emails and in-app alerts."
requires-python = ">=3.11"
dependencies = ["halyard-common", "aiosmtplib>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
