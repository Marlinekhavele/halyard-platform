[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# importlib mode: every service has its own tests/ folder and conftest.py.
addopts = --import-mode=importlib
testpaths =
    packages/halyard-common/tests
    services/accounts/tests
    services/commercial/tests
    services/operations/tests
    services/billing/tests
    services/notifications/tests
    tests
filterwarnings =
    ignore::DeprecationWarning
